<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fdba74" />
      <stop offset="35%" stop-color="#f472b6" />
      <stop offset="70%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#fb923c" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f472b6" stop-opacity="0.7" />
      <stop offset="40%" stop-color="#c084fc" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.9" />
    </linearGradient>
  </defs>
  <!-- Sunset Sky -->
  <rect width="1200" height="480" fill="url(#skyGrad)" />
  <!-- Glowing Sun -->
  <circle cx="680" cy="220" r="100" fill="url(#sunGrad)" opacity="0.9" filter="blur(8px)" />
  <circle cx="680" cy="220" r="85" fill="#fffbeb" opacity="0.95" />
  <!-- Distant Mountains -->
  <path d="M0,290 Q220,180 440,280 T880,260 Q1060,200 1200,290 L1200,480 L0,480 Z" fill="#6b21a8" opacity="0.35" />
  <path d="M0,320 Q300,240 600,310 T1200,300 L1200,480 L0,480 Z" fill="#4c1d95" opacity="0.5" />
  <!-- Shimmering Water Lake -->
  <rect y="330" width="1200" height="150" fill="url(#waterGrad)" />
  <!-- Sun Reflection on water -->
  <ellipse cx="680" cy="380" rx="140" ry="24" fill="#fde047" opacity="0.4" filter="blur(6px)" />
  <!-- Foreground Cherry Blossom Silhouettes & Flowers -->
  <g fill="#f43f5e" opacity="0.85">
    <circle cx="100" cy="420" r="35" fill="#fda4af" />
    <circle cx="140" cy="400" r="28" fill="#f43f5e" />
    <circle cx="180" cy="430" r="40" fill="#fb7185" />
    <circle cx="1020" cy="410" r="42" fill="#fda4af" />
    <circle cx="1080" cy="390" r="32" fill="#f43f5e" />
    <circle cx="1140" cy="430" r="45" fill="#fb7185" />
  </g>
</svg>
